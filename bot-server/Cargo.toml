[package]
name = "bot-server"
version = "0.1.0"
edition = "2021"

[features]
default = []
# GPU depth-limited search (Apple Metal) — forwards to play-harness/solver-core.
# Opt-in; the runtime GPU branch is also gated by the GPU_SEARCH env flag.
metal = ["play-harness/metal", "solver-core/metal"]

[dependencies]
play-harness = { path = "../play-harness" }
solver-core = { path = "../solver-core" }
axum = "0.7"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
