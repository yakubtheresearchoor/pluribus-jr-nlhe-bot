[package]
name = "play-harness"
version = "0.1.0"
edition = "2021"

# The harness scores hands through clean-rules (the independent rules
# oracle) and loads blueprints/agents through solver-core. The RULES
# side must stay in clean-rules — never re-implement or import solver
# terminal machinery here for scoring.
[features]
default = []
# GPU depth-limited search path (Apple Metal). Opt-in: forwards to solver-core's
# metal feature so `gpu_search_flop_strat` is available; the runtime GPU branch
# is additionally gated by the GPU_SEARCH env flag.
metal = ["solver-core/metal"]

[dependencies]
clean-rules = { path = "../clean-rules" }
solver-core = { path = "../solver-core" }
rayon = "1.8"
serde = { version = "1", features = ["derive"] }
zstd = "0.13"
