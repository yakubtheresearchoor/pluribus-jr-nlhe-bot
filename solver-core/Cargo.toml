[package]
name = "solver-core"
version = "0.1.0"
edition = "2021"

[dependencies]
metal = { version = "0.33", optional = true }
objc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1.8"
rand = "0.8"

[features]
default = []
metal = ["dep:metal", "dep:objc"]

[dev-dependencies]
postflop-solver = { path = "../../surstromming-solver-6max/postflop-solver" }
