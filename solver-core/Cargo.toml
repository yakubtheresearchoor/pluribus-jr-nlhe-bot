[package]
name = "solver-core"
version = "0.1.0"
edition = "2021"

[dependencies]
cudarc = { version = "0.19", optional = true, features = ["cuda-13020"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
rayon = "1.8"
rand = "0.8"

[features]
default = []
cuda = ["dep:cudarc"]
