[package]
name = "solver-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pluribus-solver"
path = "src/main.rs"

[dependencies]
solver-core = { path = "../solver-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
chrono = "0.4"
anyhow = "1"
rayon = "1"
